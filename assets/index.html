    <symbol id="i-box" viewBox="0 0 24 24"><path d="M12 3.5l7.5 4.3v8.4L12 20.5l-7.5-4.3V7.8z"/><path d="M4.5 7.8L12 12l7.5-4.2M12 12v8.5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10 9l5 3-5 3z"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.5 6.2a4 4 0 0 0 4.9 5.2L12 18.8 8.2 15l7.6-7.6z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 12.5h9l1-12.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 15.8v.2"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  </svg>

  <aside id="sidebar" aria-label="Chats and settings">
    <div class="brand">
      <span class="logo"><svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg></span>
      <div class="brand-text">
        <h1>OpenRO</h1>
        <div id="game-name">__GAME_NAME__</div>
      </div>
    </div>
    <button id="new-chat" class="btn" type="button"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-plus"/></svg>New chat</button>
    <nav aria-label="Your chats">
      <ul id="chat-list">
        <li><div class="skel" style="height:44px"></div></li>
      </ul>
    </nav>
    <div id="settings">
      <h2>Settings</h2>
      <div class="set-row">
        <span class="set-name">Appearance</span>
        <div class="segmented" role="group" aria-label="Appearance">
          <button class="theme-btn" type="button" data-set-theme="dark" aria-pressed="true">Dark</button>
          <button class="theme-btn" type="button" data-set-theme="light" aria-pressed="false">Light</button>
        </div>
      </div>
    </div>
  </aside>
  <div id="scrim" hidden></div>

  <main>
    <header class="top">
      <button id="menu-btn" class="btn btn-quiet" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open the menu">
        <svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <h2 id="chat-title">New chat</h2>
      <span id="status-chip" class="chip __CHIP_CLASS__" role="status">Roblox __CHIP__</span>
    </header>
    __KEY_BANNER__
    <div id="thread" aria-live="polite" aria-busy="true">
      <div class="skel" style="height:72px"></div>
      <div class="skel" style="height:120px"></div>
    </div>
    <div class="dock">
      <div class="dock-inner">
        <div id="ideas" hidden>
          <span class="ideas-label">Next ideas</span>
          <div class="idea-btns" id="idea-btns"></div>
        </div>
        <div id="undo-confirm" role="group" aria-label="Undo the last build" hidden>
          <p>Undo the last build? Your game goes back to how it was before that build.</p>
          <button id="undo-no" class="btn btn-quiet" type="button">Keep it</button>
          <button id="undo-yes" class="btn btn-primary" type="button">Yes, undo it</button>
        </div>
        <form id="composer">
          <label class="sr-only" for="composer-input">Describe your game</label>
          <input id="composer-input" type="text" placeholder="Describe your game, for example: a lava obby with coins" autocomplete="off">
          <button id="revert" class="btn" type="button" aria-expanded="false" aria-controls="undo-confirm" aria-label="Undo the last build" disabled><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg>Undo…</button>
          <button id="send" class="btn btn-primary" type="submit"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-send"/></svg>Send</button>
        </form>
      </div>
    </div>
  </main>

  <aside id="place-panel" class="" aria-label="In your game">
    <div class="place-head">
      <h2>In your game</h2>
      <button id="place-toggle" type="button" aria-expanded="true" aria-controls="place-body" aria-label="Collapse In your game"><svg class="ic" aria-hidden="true"><use href="#i-chev"/></svg></button>
    </div>
    <div id="place-body">
      <div class="place-skel" aria-hidden="true"><span class="skel"></span><span class="skel"></span></div>
    </div>
  </aside>

<script>
  const $ = (id) => document.getElementById(id);
  const thread = $('thread');
  const chatList = $('chat-list');
  const rootEl = document.documentElement;
  const CAN_BUILD = __CAN_BUILD__;
  const STUDIO = __STUDIO_CONNECTED__;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CONSOLE_PREFIX = 'Console from the failed test run: ';
  /* server errors that are config problems: the plain sentence goes on the thread, the raw line behind Details */
  const PLAIN_ERRORS = [
    { re: /^no model key/, say: 'Chat is off: no model key is set, so OpenRO cannot answer. Ask whoever runs OpenRO to add a model key, then restart it.' },
    { re: /^Studio not connected/, say: 'Studio is not connected, so nothing can be built. Open Roblox Studio with the OpenRO connection running, then send again.' },
  ];
  const IDEA_PREFIX = 'OpenRO: Idea — ';
  const DASH = /\s—\s/g;
  const ADDS = {
    spawn_link: 'Spawn point', checkpoints: 'Checkpoints', kill_brick: 'Lava that burns',
    currency: 'Coins that save', day_night: 'Day and night', shop: 'A shop', game_gui: 'A game screen',
    round_manager: 'Rounds', leaderboard: 'Leaderboard', soundtrack: 'Music',
  };
  const CLASSES = { SpawnLocation: 'spawn point', Part: 'block' };
  const PLACE_KIND = { ServerScriptService: 'server script', ServerStorage: 'stored script', StarterGui: 'screen', StarterPlayer: 'player script', ReplicatedStorage: 'shared script', Workspace: 'in the world' };
  const state = {
    lines: [], ideas: [], local: [], pendingUser: '', busy: false,
    threadError: false, loaded: false, shown: 0, undoOpen: false,
    built: null,
  };

  /* small builders: every piece of user or model text goes in as textContent */
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function icon(name, cls) {
    const s = document.createElementNS(SVG_NS, 'svg');
    s.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
    s.setAttribute('aria-hidden', 'true');
    const u = document.createElementNS(SVG_NS, 'use');
    u.setAttribute('href', '#i-' + name);
    s.appendChild(u);
    return s;
  }
  function plain(s) { return s.replace(DASH, ', '); }

  /* appearance: the segmented control; the choice persists on this device */
  const themeBtns = document.querySelectorAll('.theme-btn');
  function syncThemeBtns() {
    const cur = rootEl.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    themeBtns.forEach((b) => b.setAttribute('aria-pressed', b.getAttribute('data-set-theme') === cur ? 'true' : 'false'));
  }
  themeBtns.forEach((b) => b.addEventListener('click', () => {
    const next = b.getAttribute('data-set-theme');
    rootEl.setAttribute('data-theme', next);
    try { localStorage.setItem('openro-theme', next); } catch (e) {}
    syncThemeBtns();
  }));
  syncThemeBtns();

  /* phone menu sheet */
  const menuBtn = $('menu-btn');
  const scrim = $('scrim');
  function setMenu(open) {
    document.body.classList.toggle('menu-open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    scrim.hidden = !open;
  }
  menuBtn.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
  scrim.addEventListener('click', () => { setMenu(false); menuBtn.focus(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('menu-open')) { setMenu(false); menuBtn.focus(); }
  });

  /* the place panel: collapsible, wide screens only */
  const placePanel = $('place-panel');
  const placeToggle = $('place-toggle');
  placeToggle.addEventListener('click', () => {
    const collapsed = placePanel.classList.toggle('collapsed');
    placeToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    placeToggle.setAttribute('aria-label', collapsed ? 'Expand In your game' : 'Collapse In your game');
  });

  /* thread lines are plain text from the server; classify them into the thread's rows */
  function classify(line) {
    if (line.startsWith('You: ')) return { kind: 'user', text: line.slice(5) };
    if (line.startsWith(IDEA_PREFIX)) {
      const rest = line.slice(IDEA_PREFIX.length);
      const i = rest.indexOf(': ');
      return { kind: 'idea', title: i < 0 ? rest : rest.slice(0, i), pitch: i < 0 ? '' : rest.slice(i + 2) };
    }
    if (line.startsWith('OpenRO: ')) return { kind: 'agent', text: plain(line.slice(8)) };
    if (line.startsWith(CONSOLE_PREFIX)) return { kind: 'console', text: line.slice(CONSOLE_PREFIX.length), raw: line };
    if (line === 'Playtest passed.') return { kind: 'verdict', tone: 'ok', raw: line };
    if (line.startsWith('Playtest failed')) return { kind: 'verdict', tone: 'bad', raw: line };
    if (line.startsWith('Playtest result was not')) return { kind: 'verdict', tone: 'warn', raw: line };
    return { kind: 'step', raw: line };
  }
  function stepInfo(raw) {
    let m = raw.match(/^Wrote (.+)\.$/);
    if (m) return { icon: 'doc', label: 'Saved the script ' + m[1].split('.').pop(), result: 'Saved' };
    m = raw.match(/^Generated the (.+) script\.$/);
    if (m) return { icon: 'doc', label: 'Wrote the ' + m[1].replace(/_/g, ' ') + ' code', result: 'Written' };
    m = raw.match(/^Created (.+) \((.+)\)\.$/);
    if (m) return { icon: 'box', label: 'Added ' + m[1].split('.').pop() + ' (' + (CLASSES[m[2]] || m[2].toLowerCase()) + ')', result: 'Added' };
    m = raw.match(/^Deleted (.+)\.$/);
    if (m) return { icon: 'trash', label: 'Removed ' + m[1].split('.').pop(), result: 'Removed' };
    return { icon: 'check', label: plain(raw), result: 'Done' };
  }
  function verdictBlock(item) {
    const v = el('div', 'verdict ' + item.tone);
    if (item.tone === 'ok') {
      v.appendChild(icon('check'));
      const body = el('div');
      body.appendChild(el('strong', '', 'Passed'));
      body.appendChild(el('p', '', 'The test run played through with no errors.'));
      v.appendChild(body);
    } else if (item.tone === 'bad') {
      v.appendChild(icon('x'));
      const body = el('div');
      body.appendChild(el('strong', '', 'Failed'));
      body.appendChild(el('p', '', 'The test run found a problem. OpenRO is reading the error and repairing your game.'));
      v.appendChild(body);
    } else {
      v.appendChild(icon('alert'));
      const body = el('div');
      body.appendChild(el('strong', '', 'Not proven yet'));
      body.appendChild(el('p', '', 'The test run result could not be read, so this build counts as unproven. OpenRO will test again.'));
      v.appendChild(body);
    }
    const det = el('details');
    det.appendChild(el('summary', '', 'Details'));
    det.appendChild(el('pre', '', item.raw));
    v.lastChild.appendChild(det);
    return v;
  }
  function userRow(text, fresh) {
    const row = el('div', 'row user' + (fresh ? ' fresh' : ''));
    row.appendChild(el('div', 'bubble', text));
    return row;
  }
  function agentRow(text, fresh, bad) {
    const row = el('div', 'row' + (fresh ? ' fresh' : ''));
    const av = el('span', 'avatar');
    av.appendChild(icon('spark', 'ic-sm'));
    row.appendChild(av);
    const bubble = el('div', 'bubble' + (bad ? ' bad' : ''));
    const known = PLAIN_ERRORS.find((e) => e.re.test(text));
    const cut = text.indexOf(' (Details: ');
    const plainText = known ? known.say : cut < 0 ? text : text.slice(0, cut);
    const raw = known ? text : cut < 0 ? '' : text.slice(cut + 11, -1);
    bubble.appendChild(el('span', '', plainText));
    if (raw) {
      const det = el('details', 'bubble-details');
      det.appendChild(el('summary', '', 'Details'));
      det.appendChild(el('pre', '', raw));
      bubble.appendChild(det);
    }
    row.appendChild(bubble);
    return row;
  }
  function welcome() {
    const s = el('section', 'welcome');
    s.appendChild(el('h2', '', 'What do you want to make?'));
    s.appendChild(el('p', '', CAN_BUILD
      ? 'Pick one of these ideas, or describe your own game in the box below. OpenRO builds it in Roblox Studio and runs a test before it says it is done.'
      : 'Pick an idea or describe your own game below. To build it, OpenRO needs a model key and a Roblox Studio connection. See the notice above.'));
    s.appendChild(el('p', 'welcome-studio', 'Roblox Studio is where your game lives; OpenRO needs it open to build and test.'));
    return s;
  }
  function ideaRecord(title) {
    return state.ideas.find((i) => i.title === title) || null;
  }
  function ideaCard(title, pitch, fresh) {
    const rec = ideaRecord(title);
    const card = el('article', 'idea-card' + (fresh ? ' fresh' : ''));
    card.appendChild(el('h3', '', title));
    card.appendChild(el('p', '', plain(rec ? rec.pitch : pitch)));
    if (rec && rec.skills && rec.skills.length) {
      card.appendChild(el('span', 'adds-label', 'What it adds'));
      const list = el('ul', 'adds');
      [...new Set(rec.skills.map((s) => ADDS[s] || s.replace(/_/g, ' ')))].forEach((t) => list.appendChild(el('li', '', t)));
      card.appendChild(list);
    }
    const b = el('button', 'btn btn-primary', 'Build this');
    b.type = 'button';
    b.setAttribute('data-focus-key', 'idea:' + title);
    b.setAttribute('aria-label', 'Build ' + title);
    if (rec) {
      b.disabled = !STUDIO || state.busy;
      if (!STUDIO) b.setAttribute('aria-describedby', 'no-studio-banner');
      b.addEventListener('click', () => buildIdea(rec, b));
    } else {
      b.disabled = true;
    }
    card.appendChild(b);
    if (rec && !STUDIO) card.appendChild(el('p', 'muted', 'Connect Studio to build this. The banner above says how.'));
    if (!rec) card.appendChild(el('p', 'muted', 'Already in your game, or not on offer now. The next ideas above are the ones you can build.'));
    return card;
  }
  function stepRow(raw) {
    const info = stepInfo(raw);
    const li = el('li', 'step');
    const ic = el('span', 'step-icon');
    ic.appendChild(icon(info.icon, 'ic-sm'));
    li.appendChild(ic);
    const body = el('div');
    body.appendChild(el('div', 'step-label', info.label));
    const det = el('details');
    det.appendChild(el('summary', '', 'Details'));
    det.appendChild(el('pre', '', raw));
    body.appendChild(det);
    li.appendChild(body);
    li.appendChild(el('span', 'step-result', info.result));
    return li;
  }
  /* one build card per run of steps; verdict bands sit between the step lists in order */
  function buildCard(fresh) {
    const card = el('section', 'build' + (fresh ? ' fresh' : ''));
    card.appendChild(el('div', 'build-head', 'What OpenRO did'));
    return card;
  }

  /* the thread: a fresh render from the server's lines, plus this screen's own notices */
  function renderThread() {
    const items = state.lines.map(classify);
    const hasUser = items.some((i) => i.kind === 'user') || !!state.pendingUser;
    const hasBuild = items.some((i) => i.kind === 'step' || i.kind === 'verdict');
    const fresh = (i) => state.loaded && i >= state.shown;
    thread.textContent = '';
    thread.setAttribute('aria-busy', 'false');
    if (state.threadError) {
      const err = el('div', 'thread-error');
      err.appendChild(el('strong', '', 'Could not load the conversation.'));
      err.appendChild(el('p', '', 'The OpenRO server did not answer. Try again, or reload the page.'));
      const retry = el('button', 'btn', 'Try again');
      retry.type = 'button';
      retry.setAttribute('data-focus-key', 'retry');
      retry.addEventListener('click', async () => { await refreshAll(); restoreFocus('retry'); });
      err.appendChild(retry);
      thread.appendChild(err);
      return;
    }
    if (!hasUser && !hasBuild) thread.appendChild(welcome());
    let group = null;
    let groupKind = '';
    let lastVerdict = null;
    items.forEach((it, i) => {
      const kind = it.kind === 'step' || it.kind === 'verdict' || it.kind === 'console' ? 'build' : it.kind === 'idea' ? 'idea' : '';
      if (kind !== groupKind) { group = null; groupKind = kind; }
      if (kind === 'build') {
        if (!group) { group = buildCard(fresh(i)); thread.appendChild(group); }
        if (it.kind === 'console') {
          const pre = lastVerdict && lastVerdict.querySelector('pre');
          if (pre) pre.textContent = 'Console output from the test run:\n' + it.text;
          return;
        }
        if (it.kind === 'verdict') { lastVerdict = verdictBlock(it); group.appendChild(lastVerdict); return; }
        let ol = group.lastElementChild && group.lastElementChild.tagName === 'OL' ? group.lastElementChild : null;
        if (!ol) { ol = el('ol', 'steps'); group.appendChild(ol); }
        ol.appendChild(stepRow(it.raw));
        return;
      }
      if (kind === 'idea') {
        if (!group) { group = el('div', 'ideas-block'); thread.appendChild(group); }
        group.appendChild(ideaCard(it.title, it.pitch, fresh(i)));
        return;
      }
      if (it.kind === 'user') thread.appendChild(userRow(it.text, fresh(i)));
      else if (it.kind === 'agent') thread.appendChild(agentRow(it.text, fresh(i), /could not|did not|not connected|no model/i.test(it.text)));
      else thread.appendChild(agentRow(it.raw, fresh(i), false));
    });
    state.local.forEach((n) => thread.appendChild(n.user ? userRow(n.text, true) : agentRow(n.text, true, n.bad)));
    if (state.pendingUser) thread.appendChild(userRow(state.pendingUser, true));
    if (state.busy) {
      const w = el('div', 'working');
      w.setAttribute('role', 'status');
      const dots = el('span', 'dots');
      for (let k = 0; k < 3; k++) dots.appendChild(el('span'));
      w.appendChild(dots);
      w.appendChild(el('span', '', 'OpenRO is working on it. A build can take a minute or two.'));
      thread.appendChild(w);
    }
    /* a conversation scrolls to its latest line; a fresh chat keeps its heading and ideas in view */
    if (hasUser || hasBuild || state.busy || state.pendingUser) thread.scrollTop = thread.scrollHeight;
    state.shown = items.length;
    state.loaded = true;
    renderChips(items);
  }
  function renderChips(items) {
    const box = $('ideas');
    const has = items.some((i) => i.kind === 'user' || i.kind === 'step' || i.kind === 'verdict');
    const list = $('idea-btns');
    list.textContent = '';
    if (!has || !state.ideas.length) { box.hidden = true; return; }
    box.hidden = false;
    state.ideas.forEach((idea) => {
      const b = el('button', 'idea-chip');
      b.type = 'button';
      b.appendChild(icon('plus', 'ic-sm'));
      b.appendChild(el('span', '', idea.title));
      b.setAttribute('data-focus-key', 'idea:' + idea.title);
      b.setAttribute('aria-label', 'Build ' + idea.title);
      b.disabled = !STUDIO || state.busy;
      if (!STUDIO) b.title = 'Connect Studio to build this';
      b.addEventListener('click', () => buildIdea(idea, b));
      list.appendChild(b);
    });
  }

  async function refreshThread() {
    try {
      const r = await fetch('/api/thread');
      if (!r.ok) throw new Error('thread');
      const data = await r.json();
      state.lines = data.thread;
      state.threadError = false;
    } catch (err) {
      if (!state.lines.length) state.threadError = true;
    }
    renderThread();
  }

  /* chat list: the chats are real buttons; the list keeps its last good state on failure */
  async function refreshChats() {
    try {
      const r = await fetch('/api/chats');
      if (!r.ok) throw new Error('chats');
      const data = await r.json();
      chatList.textContent = '';
      for (const c of data.chats) {
        const li = document.createElement('li');
        const btn = el('button', 'chat-btn', c.title || 'New chat');
        btn.type = 'button';
        if (c.id === data.active) {
          btn.setAttribute('aria-current', 'true');
          $('chat-title').textContent = c.title || 'New chat';
        }
        btn.addEventListener('click', async () => {
          try {
            const sr = await fetch('/api/chats/select', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: c.id }) });
            if (!sr.ok) throw new Error('select');
          } catch (err) {
            notice('Could not switch chats. The server did not answer.', true);
            return;
          }
          setMenu(false);
          await refreshChats();
          await refreshAll();
        });
        li.appendChild(btn);
        chatList.appendChild(li);
      }
    } catch (err) { /* the list keeps its last good state */ }
  }

  /* ideas: the pitch lands in the thread; the same set feeds the cards and the chips */
  async function refreshIdeas() {
    try {
      const r = await fetch('/api/ideas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      if (!r.ok) return;
      const data = await r.json();
      state.ideas = data.ideas || [];
      if (data.pitched_new) await refreshThread();
      else renderThread();
    } catch (err) { /* the cards keep their last good state */ }
  }

  function notice(text, bad) {
    state.local.push({ text, bad: !!bad });
    renderThread();
  }
  function setBusy(on) {
    state.busy = on;
    $('send').disabled = on;
    syncUndo();
  }
  /* Undo is offered only when the game has something built (the place tree says so) */
  function syncUndo() {
    const b = $('revert');
    b.disabled = state.busy || state.built === null || state.built === 0;
    b.title = state.built === 0 ? 'Nothing built yet' : state.built === null ? 'Connect Studio to see what is built' : '';
  }

  /* after a re-render the trigger is a new node: focus its successor, else the composer */
  function restoreFocus(key) {
    const a = document.activeElement;
    if (a && a !== document.body) return;
    const t = key ? document.querySelector('[data-focus-key="' + CSS.escape(key) + '"]') : null;
    if (t && !t.disabled) t.focus(); else $('composer-input').focus();
  }

  async function buildIdea(idea, btn) {
    const key = btn.getAttribute('data-focus-key');
    state.local = [];
    btn.disabled = true;
    btn.textContent = 'Building…';
    setBusy(true);
    renderThread();
    try {
      const r = await fetch('/api/ideas/build', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: idea.id }) });
      const data = await r.json();
      if (!data.ok) notice(data.error, true);
      else if (data.ideas) state.ideas = data.ideas;
    } catch (err) {
      notice('Could not reach the OpenRO server.', true);
    }
    setBusy(false);
    await refreshAll();
    restoreFocus(key);
  }

  /* the composer: the ask is shown at once and the build shows as it runs.
     A send that does not go through keeps the words: the user line stays,
     a plain error sits under it, and the text goes back in the box. */
  const SEND_FAILED = 'That did not go through. Nothing was built. Your message is back in the box.';
  $('composer').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('composer-input');
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    state.local = [];
    state.pendingUser = message;
    setBusy(true);
    renderThread();
    let failure = null;
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message }) });
      const data = await r.json().catch(() => ({}));
      /* refused before it reached the chat (too large, wrong type, forbidden): the server's own words */
      if (r.status === 403 || r.status === 413 || r.status === 415) failure = data.error || 'OpenRO did not take that message.';
      else if (r.status >= 500 && !data.ok) failure = SEND_FAILED;
    } catch (err) {
      failure = SEND_FAILED;
    }
    state.pendingUser = '';
    setBusy(false);
    await refreshAll();
    /* if the server recorded the words, its own thread lines already tell the story */
    if (failure && !state.lines.includes('You: ' + message)) {
      state.local.push({ text: message, user: true });
      state.local.push({ text: failure, bad: true });
      input.value = message;
      renderThread();
    }
    input.focus();
  });

  /* undo last build: a secondary control with a confirm step */
  const undoBox = $('undo-confirm');
  const revertBtn = $('revert');
  function setUndo(open) {
    state.undoOpen = open;
    undoBox.hidden = !open;
    revertBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) $('undo-yes').focus();
  }
  revertBtn.addEventListener('click', () => setUndo(!state.undoOpen));
  $('undo-no').addEventListener('click', () => { setUndo(false); revertBtn.focus(); });
  $('undo-yes').addEventListener('click', async () => {
    setUndo(false);
    state.local = [];
    setBusy(true);
    try {
      const r = await fetch('/api/revert', { method: 'POST' });
      const data = await r.json();
      if (data.ok) notice('Undid the last build. ' + data.restored.length + ' change(s) were put back.');
      else if (data.error === 'nothing to revert') notice('Nothing to undo. No build is waiting to be undone in this chat.');
      else notice(data.error, true);
    } catch (err) {
      notice('Could not reach the OpenRO server.', true);
    }
    setBusy(false);
    await refreshAll();
    (revertBtn.disabled ? $('composer-input') : revertBtn).focus();
  });

  /* In your game: the real place tree from the server */
  async function refreshPlace() {
    const body = $('place-body');
    try {
      const r = await fetch('/api/place-tree');
      if (!r.ok) throw new Error('place');
      const tree = await r.json();
      const scripts = Object.keys(tree.scripts || {});
      const parts = Object.keys(tree.instances || {});
      state.built = scripts.length + parts.length;
      syncUndo();
      body.textContent = '';
      if (!scripts.length && !parts.length) {
        body.appendChild(el('p', 'place-empty', 'Nothing built yet. When OpenRO builds something, its scripts and parts show here.'));
        return;
      }
      const section = (title, names) => {
        const s = el('section', 'place-section');
        const h = el('h3', '', title);
        h.appendChild(el('span', '', String(names.length)));
        s.appendChild(h);
        const ul = el('ul', 'place-list');
        names.forEach((n) => {
          /* the plain name first; the raw path sits behind Details */
          const parts = n.split('.');
          const li = el('li');
          li.appendChild(el('span', 'place-name', parts[parts.length - 1].replace(/([a-z])([A-Z])/g, '$1 $2')));
          li.appendChild(el('span', 'place-kind', PLACE_KIND[parts[0]] || 'part'));
          const det = el('details');
          det.appendChild(el('summary', '', 'Details'));
          det.appendChild(el('code', '', n));
          li.appendChild(det);
          ul.appendChild(li);
        });
        s.appendChild(ul);
        return s;
      };
      if (scripts.length) body.appendChild(section('Scripts', scripts));
      if (parts.length) body.appendChild(section('Parts', parts));
    } catch (err) {
      state.built = null;
      syncUndo();
      body.textContent = '';
      body.appendChild(el('p', 'place-empty', 'Could not read your game. Check that Studio is connected, then try again.'));
    }
  }

  $('new-chat').addEventListener('click', async () => {
    try {
      const r = await fetch('/api/chats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      if (!r.ok) throw new Error('new chat');
    } catch (err) {
      notice('Could not reach the OpenRO server.', true);
      return;
    }
    setMenu(false);
    state.local = [];
    state.shown = 0;
    await refreshChats();
    await refreshAll();
    $('composer-input').focus();
  });

  async function refreshAll() {
    await refreshChats();
    await refreshThread();
    await refreshIdeas();
    await refreshPlace();
  }
  document.querySelectorAll('[data-dismiss]').forEach((b) => {
    b.addEventListener('click', () => { b.closest('.banner').hidden = true; });
  });
  syncUndo();
  refreshAll();
</script>
</body>
</html>
