name: release

# Every push to main that carries a NEW version in Cargo.toml (and its CHANGELOG.md
# entry) is built for each platform and published as a GitHub Release `vX.Y.Z` with
# the binaries and a SHA256SUMS file. Pushing a tag `vX.Y.Z` by hand does the same.
# The running app reads that release to offer (or install) the update; see the
# README, "Versions and updates". A push that does not change the version does nothing.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BIN: openro-rs

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$crate" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$crate" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1
          fi
          if gh release view "v$crate" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$crate already exists: nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          grep -qE "^## \[?$crate\]?( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no entry for version $crate"; exit 1; }
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.publish == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: '' }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        run: cargo build --release --locked --bin "$BIN" --target ${{ matrix.target }}
      - name: Stage and check the asset
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "dist/${BIN}-${{ matrix.target }}${{ matrix.ext }}"
          out="$("dist/${BIN}-${{ matrix.target }}${{ matrix.ext }}" --version)"
          echo "$out"
          case "$out" in *"${{ needs.plan.outputs.version }}"*) ;; *) echo "binary does not report version ${{ needs.plan.outputs.version }}"; exit 1;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: dist/*

  release:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          test -n "$(ls dist)" || { echo "no build succeeded"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          ver="${{ needs.plan.outputs.version }}"
          awk -v v="$ver" '$0 ~ "^## \\[?"v"\\]?( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $ver." > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.plan.outputs.version }}" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$BIN v${{ needs.plan.outputs.version }}" --notes-file notes.md
