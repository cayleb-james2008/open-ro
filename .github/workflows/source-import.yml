name: Import reviewed Open-Ro source tree

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/parts/**"
      - ".github/workflows/source-import.yml"

permissions:
  contents: write

concurrency:
  group: open-ro-source-import
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/parts/00.b64
          mkdir -p "$RUNNER_TEMP/open-ro-archive" "$RUNNER_TEMP/open-ro-source"
          archive="$RUNNER_TEMP/open-ro-archive/open-ro.tar.zst"
          cat .bootstrap/parts/*.b64 | base64 --decode > "$RUNNER_TEMP/open-ro-archive/open-ro.tar.zst"
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          zstd --test "$archive"
          zstd --decompress --stdout "$archive" | tar -xf - -C "$RUNNER_TEMP/open-ro-source"
          test -f "$RUNNER_TEMP/open-ro-source/open-ro/PROJECT.md"
          test -f "$RUNNER_TEMP/open-ro-source/open-ro/README.md"
          test -f "$RUNNER_TEMP/open-ro-source/open-ro/docs/ROADMAP.md"
          test -f "$RUNNER_TEMP/open-ro-source/open-ro/electron/main.ts"
          test -f "$RUNNER_TEMP/open-ro-source/open-ro/LICENSE"

      - name: Replace temporary bootstrap with the complete project
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/open-ro-source/open-ro/." .
          rm -rf .bootstrap
          rm -f .github/workflows/source-import.yml
          test -f PROJECT.md
          test -f README.md
          test -f docs/ROADMAP.md
          test -f electron/main.ts
          test -f LICENSE
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: establish Open-Ro project charter and product roadmap"
          git push origin HEAD:main
