[package]
name = "openro-rs"
version = "1.18.0"
edition = "2021"

[dependencies]
flate2 = "1"
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.11"
rune = { version = "0.14", default-features = false, features = ["std"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.serde]
opt-level = "s"

[profile.release.package.serde_core]
opt-level = "s"

[profile.release.package.serde_json]
opt-level = "s"

[profile.release.package.memchr]
opt-level = 3
