<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenRO builds your Roblox game in Roblox Studio from a plain description or blueprint, proves every build with a playtest, and can undo the last build." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2L3 7v10l9 5 9-5V7l-9-5zm0 2.4L18.4 8 12 11.6 5.6 8 12 4.4zM5 9.9l6 3.4v6.3l-6-3.3V9.9zm8 9.7v-6.3l6-3.4v6.4l-6 3.3z' fill='%23141413'/%3E%3C/svg%3E" />
    <title>OpenRO: __GAME_NAME__</title>
    <script>try{var t=localStorage.getItem("openro-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
function openroSetTheme(t){try{localStorage.setItem("openro-theme",t)}catch(e){}}
window.openroSetTheme=openroSetTheme;</script>
  </head>
  <body data-app="openro">
    <noscript><p>OpenRO needs JavaScript to show your Studio chats and builds. Turn JavaScript on in this browser, then reload the page.</p></noscript>
    <div id="server-state" hidden data-game-name="__GAME_NAME__" data-can-build="__CAN_BUILD__" data-studio="__STUDIO_CONNECTED__" data-chip-class="__CHIP_CLASS__" data-chip="__CHIP__"></div>
    <div id="server-banners" hidden>__KEY_BANNER__</div>
    <label class="sr-only" for="composer-input">Describe your game</label>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
