<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenRO builds your Roblox game from a plain description, shows each build step, and can undo the last build." />
    <title>OpenRO: __GAME_NAME__</title>
    <script>try{var t=localStorage.getItem("openro-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
function openroSetTheme(t){try{localStorage.setItem("openro-theme",t)}catch(e){}}
window.openroSetTheme=openroSetTheme;</script>
  </head>
  <body data-app="openro">
    <noscript><p>OpenRO needs JavaScript to show your chats and builds. Turn JavaScript on in this browser, then reload the page.</p></noscript>
    <div id="server-state" hidden data-game-name="__GAME_NAME__" data-can-build="__CAN_BUILD__" data-studio="__STUDIO_CONNECTED__" data-chip-class="__CHIP_CLASS__" data-chip="__CHIP__"></div>
    <div id="server-banners" hidden>__KEY_BANNER__</div>
    <label class="sr-only" for="composer-input">Describe your game</label>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
