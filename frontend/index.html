<!doctype html>
<html lang="en" data-theme="light" data-world="studio">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="OpenRO builds your Roblox game in Roblox Studio from a plain description or blueprint, proves every build with a playtest, and can undo the last build." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M 8.18 1.9 L 28.8 7.81 L 19.9 12.75 L 13.12 10.81 L 11.18 17.58 L 2.27 22.52 Z' fill='%2300A2FF'/%3E%3Cpath d='M 23.82 30.1 L 3.2 24.19 L 12.1 19.25 L 18.88 21.19 L 20.82 14.42 L 29.73 9.48 Z' fill='%230066FF'/%3E%3C/svg%3E" />
    <title>OpenRO: __GAME_NAME__</title>
    <script>try{var t=localStorage.getItem("openro-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}
function openroSetTheme(t){try{localStorage.setItem("openro-theme",t)}catch(e){}}
window.openroSetTheme=openroSetTheme;</script>
  </head>
  <body data-app="openro">
    <noscript><p>OpenRO needs JavaScript to show your Studio chats and builds. Turn JavaScript on in this browser, then reload the page.</p></noscript>
    <div id="server-state" hidden data-game-name="__GAME_NAME__" data-can-build="__CAN_BUILD__" data-studio="__STUDIO_CONNECTED__" data-workspace-mode="__WORKSPACE_MODE__" data-chip-class="__CHIP_CLASS__" data-chip="__CHIP__"></div>
    <div id="server-banners" hidden>__KEY_BANNER__</div>
    <label class="sr-only" for="composer-input">Describe your game</label>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
